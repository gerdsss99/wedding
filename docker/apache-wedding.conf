# Wedding site: the invitation at /, the guest book at /guestbook/.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    # same behaviour the old nginx config had: unknown paths show the invitation
    FallbackResource /index.html
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
    Header always unset X-Powered-By
    # revalidate on load so a redeployed page shows up straight away
    <Directory /var/www/html>
        Header always set Cache-Control "no-cache"
    </Directory>
</IfModule>

# ---------------------------------------------------------------------------
# Guest book. Lives OUTSIDE the document root; only these URLs exist:
#   /guestbook/             the page + the book so far  (index.html)
#   /guestbook/api.php      the little JSON API
#   /guestbook/admin        the owner page (password login; /guestbook/admin.php works too)
#   /guestbook/assets/...   fonts + logo
#   /guestbook/d/<id>.png   drawings from the data volume (images only)
# ---------------------------------------------------------------------------
AliasMatch "^/guestbook/d/([0-9]{14}-[0-9]{3}-[0-9a-f]{8}\.(?:png|jpg))$" "/var/www/data/guestbook/img/$1"
AliasMatch "^/guestbook/?$" "/var/www/guestbook/index.html"
# the owner page answers on every address you might reasonably type
AliasMatch "^/(?:guestbook/)?(?:admin|admin\.php|book-admin|book-admin\.php)/?$" "/var/www/guestbook/admin.php"
AliasMatch "^/guestbook(/.+)$" "/var/www/guestbook$1"

<Directory /var/www/guestbook>
    Options -Indexes -MultiViews -FollowSymLinks +SymLinksIfOwnerMatch
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    FallbackResource disabled

    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    </FilesMatch>
    <FilesMatch "\.(woff2|png)$">
        Header always set Cache-Control "public, max-age=2592000, immutable"
    </FilesMatch>
    # only these file types are ever served from here
    <FilesMatch "^(?!(?:index\.html|api\.php|admin\.php|.*\.(?:woff2|png))$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/data/guestbook/img>
    Options -Indexes -MultiViews -ExecCGI
    AllowOverride None
    Require all granted
    # never run anything from here, only hand over images
    <FilesMatch "\.png$">
        ForceType image/png
    </FilesMatch>
    <FilesMatch "\.jpg$">
        ForceType image/jpeg
    </FilesMatch>
    <FilesMatch "\.(png|jpg)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set Content-Security-Policy "default-src 'none'; sandbox"
    </FilesMatch>
    <FilesMatch "^(?!.*\.(?:png|jpg)$)">
        Require all denied
    </FilesMatch>
</Directory>

<FilesMatch "^\.|\.(bak|old|orig|swp|sql|log|ini|env)$">
    Require all denied
</FilesMatch>
