# Builds the wedding site image on GitHub every time you push to main, and publishes it to
# GitHub's container registry. Portainer then just downloads the finished image, so nothing
# depends on Portainer's own build step.
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_REV=${{ github.sha }}
          tags: |
            ghcr.io/gerdsss99/wedding:latest
            ghcr.io/gerdsss99/wedding:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/gerdsss99/wedding
